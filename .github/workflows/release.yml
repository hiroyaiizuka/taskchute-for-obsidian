name: Release (build & push dist branch)

# このリポジトリはソース専用です。ここでビルドし、成果物
# (main.js / styles.css / manifest.json / versions.json) を配布リポジトリ
# hiroyaiizuka/taskchute-for-obsidian の release/<version> ブランチへ push する
# ところまでを行います。
#
# PR の作成とリリースノートの執筆は、配布リポジトリ側で人が手で行います。
# 配布側のワークフローは「main への push」で発火し、マージ元 PR の本文を
# そのままリリースノートに使います。
# タグ作成と Release の公開も配布リポジトリ側の責務です。
#
# バージョンの情報源は manifest.json の version です。このワークフローは採番を
# 行わず、リポジトリにコミット済みの値をそのまま使います。リリース前に
# manifest.json と versions.json を手で更新してコミットしておいてください。
#
# 事前準備: 配布リポジトリに対して Contents:write / Pull requests:read を持つ
# fine-grained PAT を、このリポジトリの Actions secret RELEASE_DIST_TOKEN に
# 登録すること。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ビルドと検証のみ行い、push はしない"
        type: boolean
        default: false

permissions:
  contents: read
  # 成果物証明 (SLSA provenance) の署名に必要。ビルドしているのはこのリポジトリ
  # なので、証明もここで発行する。検証は次のコマンド:
  #   gh attestation verify main.js --repo hiroyaiizuka/hiroyaiizuka-taskchute-for-obsidian-source
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DIST_REPO: hiroyaiizuka/taskchute-for-obsidian

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout distribution repo
        uses: actions/checkout@v4
        with:
          repository: hiroyaiizuka/taskchute-for-obsidian
          token: ${{ secrets.RELEASE_DIST_TOKEN }}
          path: dist-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # 版数の情報源は manifest.json のみ。ここでは採番も書き換えもせず、
      # コミット済みの値を読んで versions.json との整合だけを検査する。
      - name: Resolve version from manifest.json
        id: bump
        run: |
          set -euo pipefail

          NEW_VERSION=$(jq -er '.version' manifest.json)
          MIN_APP=$(jq -er '.minAppVersion' manifest.json)

          case "$NEW_VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::manifest.json の version が x.y.z 形式ではありません: $NEW_VERSION"; exit 1 ;;
          esac

          # 配布側ワークフローは versions.json のエントリが無いと fail する
          ENTRY=$(jq -r --arg v "$NEW_VERSION" '.[$v] // empty' versions.json)
          if [ -z "$ENTRY" ]; then
            echo "::error::versions.json に $NEW_VERSION のエントリがありません。手で追加してコミットしてください（値: $MIN_APP）。"
            exit 1
          fi
          if [ "$ENTRY" != "$MIN_APP" ]; then
            echo "::error::versions.json の $NEW_VERSION は $ENTRY ですが、manifest.json の minAppVersion は $MIN_APP です。"
            exit 1
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "### Release \`$NEW_VERSION\` (manifest.json より)" >> "$GITHUB_STEP_SUMMARY"

      # 公開済みのバージョンより新しくなければ、ここで打ち切る。
      - name: Check version is newer than released
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DIST_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          set -euo pipefail

          RELEASED=$(gh release view --repo "$DIST_REPO" --json tagName --jq '.tagName' 2>/dev/null || true)
          if [ -z "$RELEASED" ]; then
            echo "::notice::Release が見つからないため、配布リポジトリの manifest.json を比較対象にします。"
            RELEASED=$(jq -er '.version' dist-repo/manifest.json)
          fi

          echo "公開済みバージョン: $RELEASED"
          echo "これからリリースするバージョン: $NEW_VERSION"

          NEWEST=$(printf '%s\n%s\n' "$RELEASED" "$NEW_VERSION" | sort -V | tail -n 1)
          if [ "$NEW_VERSION" = "$RELEASED" ] || [ "$NEWEST" != "$NEW_VERSION" ]; then
            echo "::error::$NEW_VERSION は公開済みの $RELEASED より新しくありません。manifest.json の version を上げてください。"
            exit 1
          fi

          echo "OK: $NEW_VERSION は公開済みの $RELEASED より新しい"

      # 同じバージョンの PR が既に開いていれば、ここで打ち切る。
      - name: Check no open PR for this version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DIST_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          set -euo pipefail

          BRANCH="release/${NEW_VERSION}"
          EXISTING_PR=$(gh pr list --repo "$DIST_REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')

          if [ -n "$EXISTING_PR" ]; then
            echo "::error::$BRANCH の PR が既に開いています: $EXISTING_PR"
            exit 1
          fi

          echo "OK: $BRANCH の open PR は無し"

      - name: Build plugin
        env:
          NODE_ENV: production
        run: npm run build

      # 配布側と同じ検証をここで先出しし、壊れた成果物を push しないようにする。
      # styles.css はビルド生成物ではなく手書きソース。
      - name: Verify release artifacts
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          set -euo pipefail

          for f in main.js styles.css manifest.json versions.json; do
            [ -s "$f" ] || { echo "::error::$f が無いか空です。"; exit 1; }
          done

          jq -e --arg v "$NEW_VERSION" '.version == $v' manifest.json >/dev/null \
            || { echo "::error::manifest.json の version が $NEW_VERSION ではありません。"; exit 1; }
          jq -e --arg v "$NEW_VERSION" 'has($v)' versions.json >/dev/null \
            || { echo "::error::versions.json に $NEW_VERSION のエントリがありません。"; exit 1; }

      # dry run はここで終わり。以降の push 系ステップは走らない。
      - name: Stop here (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          echo "### Dry run: 検証まで完了。配布リポジトリへの push は行っていません" >> "$GITHUB_STEP_SUMMARY"

      # 配布リポジトリへ渡すバイト列そのものに証明を付ける。dry run では
      # 恒久的な記録を残したくないので実行しない。
      - name: Generate artifact attestations
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # PR は無いがブランチだけ残っている場合（前回途中で止めた等）は、
      # そのブランチの続きにコミットする。
      - name: Push artifacts to release branch
        if: ${{ !inputs.dry_run }}
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          set -euo pipefail

          BRANCH="release/${NEW_VERSION}"

          cp main.js styles.css manifest.json versions.json dist-repo/

          cd dist-repo
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git switch -c "$BRANCH" "origin/$BRANCH"
            echo "::notice::既存のブランチ $BRANCH に追加コミットします。"
          else
            git switch -c "$BRANCH"
          fi

          git add main.js styles.css manifest.json versions.json

          if git diff --cached --quiet; then
            echo "::notice::配布リポジトリに差分がありません。push をスキップします。"
            echo "### 差分が無かったため push しませんでした（\`$BRANCH\`）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "chore: release ${NEW_VERSION}"
          git push --set-upstream origin "$BRANCH"

          {
            echo "### \`$BRANCH\` を配布リポジトリへ push しました"
            echo
            echo "- https://github.com/${DIST_REPO}/compare/main...${BRANCH}?expand=1"
            echo
            echo "この後は手作業です。上のリンクから PR を作り、**本文にリリースノートを書いて**"
            echo "main にマージしてください。配布側のワークフローがその PR 本文を"
            echo "リリースノートに使い、タグ \`${NEW_VERSION}\` と Release を作成します。"
          } >> "$GITHUB_STEP_SUMMARY"
