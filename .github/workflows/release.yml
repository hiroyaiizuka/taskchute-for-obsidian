name: Release

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - versions.json
      - main.js
      - styles.css
  workflow_dispatch:
    inputs:
      dry_run:
        description: "検証のみ実行し、タグ作成と Release 公開は行わない"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Verify release artifacts
        id: verify
        run: |
          set -euo pipefail

          for f in main.js manifest.json styles.css versions.json; do
            [ -s "$f" ] || { echo "::error::$f が無いか空です。非公開リポジトリから成果物を push してください。"; exit 1; }
          done

          VERSION=$(jq -er '.version' manifest.json)
          MIN_APP=$(jq -er '.minAppVersion' manifest.json)

          # versions.json に該当バージョンのエントリがあること
          jq -e --arg v "$VERSION" 'has($v)' versions.json >/dev/null \
            || { echo "::error::versions.json に $VERSION のエントリがありません。manifest.json と同時に更新してください。"; exit 1; }

          # v なしタグ（例: 1.7.11）。既にあればリリース済みなのでスキップする
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::タグ $VERSION は既に存在するため、Release の作成をスキップしました。"
            echo "### Skipped: \`$VERSION\` は既にリリース済みです" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "### Release \`$VERSION\` (minAppVersion: $MIN_APP)" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestations
        if: ${{ steps.verify.outputs.release == 'true' && !inputs.dry_run }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Resolve release notes
        id: notes
        if: ${{ steps.verify.outputs.release == 'true' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail

          # 1. CHANGELOG.md の該当バージョンの見出し（例: `## 2.0.0 - 2026-08-06`）から
          #    次のバージョン見出しまでを本文として使う
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              $1 == "##" && $2 == ver { found = 1; next }
              found && $1 == "##" { exit }
              found { print }
            ' CHANGELOG.md > RELEASE_NOTES.md
          fi

          if [ -s RELEASE_NOTES.md ]; then
            echo "source=file" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG.md の \`$VERSION\` セクションをリリースノートに使用します。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 2. CHANGELOG.md に記載が無ければマージ済み PR の本文
          BODY=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq 'map(select(.merged_at != null)) | sort_by(.merged_at) | last | .body // empty' \
            2>/dev/null || true)

          if [ -n "${BODY:-}" ]; then
            printf '%s\n' "$BODY" > RELEASE_NOTES.md
            echo "source=file" >> "$GITHUB_OUTPUT"
            echo "::warning::CHANGELOG.md に $VERSION のセクションがありません。PR 本文をリリースノートに使用します。"
            echo "CHANGELOG.md に \`$VERSION\` のセクションが無いため、PR 本文を使用しました。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "source=auto" >> "$GITHUB_OUTPUT"
            echo "::warning::CHANGELOG.md にも PR にもリリースノートがありません。自動生成します。"
            echo "リリースノートを自動生成しました。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create GitHub Release (published)
        if: ${{ steps.verify.outputs.release == 'true' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail

          if [ "${{ steps.notes.outputs.source }}" = "file" ]; then
            NOTES_ARG=(--notes-file RELEASE_NOTES.md)
          else
            NOTES_ARG=(--generate-notes)
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            "${NOTES_ARG[@]}" \
            main.js manifest.json styles.css
