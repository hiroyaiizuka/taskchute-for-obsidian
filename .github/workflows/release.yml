name: Release (manual)

# このリポジトリは配布専用です。ビルドは非公開のソースリポジトリで行い、
# その成果物 (main.js / styles.css / manifest.json / versions.json) が
# main にコミットされた状態でこのワークフローを手動実行します。
# ここではビルドを行わず、コミット済みのファイルをそのまま Release に添付します。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "検証のみ実行し、タグ作成と Release 公開は行わない"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  ARTIFACTS: |
    main.js
    manifest.json
    styles.css

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify release artifacts
        id: verify
        run: |
          set -euo pipefail

          for f in main.js manifest.json styles.css versions.json; do
            [ -s "$f" ] || { echo "::error::$f が無いか空です。非公開リポジトリから成果物を push してください。"; exit 1; }
          done

          VERSION=$(jq -er '.version' manifest.json)
          MIN_APP=$(jq -er '.minAppVersion' manifest.json)

          # versions.json に該当バージョンのエントリがあること
          jq -e --arg v "$VERSION" 'has($v)' versions.json >/dev/null \
            || { echo "::error::versions.json に $VERSION のエントリがありません。"; exit 1; }

          # v なしタグ（例: 1.7.11）
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::タグ $VERSION は既に存在します。manifest.json のバージョンを上げてください。"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Release \`$VERSION\` (minAppVersion: $MIN_APP)" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate artifact attestations
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ARTIFACTS }}

      - name: Create GitHub Release (published)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            main.js manifest.json styles.css
