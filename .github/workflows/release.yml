name: Release (manual)

# このリポジトリは配布専用です。ビルドは非公開のソースリポジトリで行い、
# その成果物 (main.js / styles.css / manifest.json / versions.json) が
# main にコミットされた状態でこのワークフローを手動実行します。
# ここではビルドを行わず、コミット済みのファイルをそのまま Release に添付します。

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release artifacts
        id: verify
        run: |
          set -e

          for f in main.js manifest.json styles.css versions.json; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f が見つかりません。非公開リポジトリから成果物を push してください。"
              exit 1
            fi
          done

          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

          # versions.json に該当バージョンの minAppVersion があること
          node -e "
            const versions = require('./versions.json');
            const v = require('./manifest.json').version;
            if (!versions[v]) {
              console.error('ERROR: versions.json に ' + v + ' のエントリがありません。');
              process.exit(1);
            }
          "

          # v なしタグ（例: 1.7.11）
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "ERROR: タグ $VERSION は既に存在します。manifest.json のバージョンを上げてください。"
            exit 1
          fi

      - name: Create & push tag
        run: |
          TAG="${{ steps.verify.outputs.version }}"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub Release (published)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.verify.outputs.version }}
          name: ${{ steps.verify.outputs.version }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
