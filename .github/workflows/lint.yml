name: Lint

# Safety net for the pre-commit hook: the hook only lints staged files, and it
# can be skipped with --no-verify, so CI lints the whole tree.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      # Obsidian's plugin review, run on every pull request rather than only at
      # release time, so a finding shows up on the change that introduced it
      # instead of on the plugin's public page after the release. Warnings are
      # annotated on the diff but do not fail the check (see
      # scripts/obsidian-review.mjs); errors do.
      - name: Build plugin for review
        run: npm run build

      - name: Obsidian plugin review
        run: npm run review:obsidian
