name: Test

# The merge gate. Runs on PRs targeting main, plus on main itself so a merge
# that lands without a green PR still gets checked.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci

      # ts-jest transpiles without diagnostics and esbuild skips type checking,
      # so nothing else in this workflow catches type errors.
      - name: Typecheck
        run: npm run typecheck

      # The *.integration.test.ts suites run in their own job below; this one
      # stays fast and is the merge gate.
      #
      # It also guards a Linux-only spawn limit that no macOS run can reach:
      # the broker ships as the single `-e` argument of a spawned node, and
      # Linux rejects an execve whose individual argv string exceeds
      # MAX_ARG_STRLEN (32 * PAGE_SIZE = 131_072 bytes) with E2BIG. See
      # broker-source-budget.test.ts.
      - name: Test
        run: npm run test:unit

  # Separate from the unit job on purpose: these suites spawn real processes,
  # PTYs and sockets, so they need their own timeout and can be made
  # non-required while their pass rate on ubuntu is still being established.
  integration:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    # Blocking. It was report-only from the day it was added until this commit,
    # because it had never once been green — 82 cases, and up to five failed on
    # every run. Four defects that only a Linux kernel can produce are what that
    # was, fixed across #134 and #135 and measured in a Debian 12 container
    # running the same suites:
    #
    #   resilience suite   before: 5 failed   after: 0 failed
    #   broker suite       before: 1 failed   after: 0 failed
    #
    # An earlier version of this comment blamed cross-test interference. That was
    # wrong, and so was every explanation reached by reading the surviving
    # processes instead of what the broker and watchdog actually decided. What
    # the four turned out to be:
    #
    #   1. Linux has no wall-clock process start time. It derives one, as boot
    #      time plus the start in jiffies, both truncated, so `ps` reports the
    #      second BEFORE the clock reading that bracketed spawn() — 7 times in 40
    #      at HZ=100, against 40 of 40 exact on macOS. Every ownership check
    #      failed for those, so nothing was ever signalled. This is the 1-in-6
    #      that made the failing set look random.
    #   2. `readlink /proc/<pid>/fd/<n>` returns EACCES for a sibling's
    #      descriptor, so the sentinel that authenticates an owned process could
    #      not be read at all. macOS answers the same question through lsof and
    #      never hit it.
    #   3. The first fix for (2) waited before falling back to weaker evidence.
    #      The session guard removes the owner records within ~100ms of the
    #      broker's death, so waiting meant losing the only record naming the
    #      process, and exiting to report the session clean.
    #
    #   4. The same truncation as (1), in a second spelling the shared fix did
    #      not reach: the guard skipped any process in the target's group whose
    #      reported start was below `posixBirthFloor(sessionStart)`. A
    #      background process reported one second early was never captured and
    #      never signalled, so it held the PTY open and the session's exit was
    #      never emitted — the run looked hung rather than finished. Both
    #      comparisons now go through the shared helpers, and a composition test
    #      rejects a third spelling.
    #
    # Reproducing this locally needs `docker run --init`. Without a real init as
    # PID 1, nothing reaps orphaned zombies, so SIGKILLed processes stay visible
    # to kill(pid, 0) forever and every reap assertion fails for a reason that
    # does not exist on a runner. That artifact cost more time than the bugs did.
    #
    # If something fails here again: TASKCHUTE_OWNER_WATCH_TRACE=<path> makes the
    # watchdog write one line per round naming each pid, the verdict, the
    # evidence behind it, and what it signalled. Every one of the four above was
    # found by tracing a decision; none was found by reading survivors.
    #
    # Green on the #135 run and on main immediately after it. It blocks from
    # here, because a job nobody has to look at is how the four below survived a
    # release: they were visible in a report for weeks.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci

      # Turns "17 cases were mysteriously skipped" into one named error before
      # any test runs. Everything here ships in the ubuntu-latest image; if this
      # step ever fails, install exactly what it names rather than guessing.
      - name: Verify the binaries these suites drive
        run: |
          set -euo pipefail
          for binary in /bin/ps /bin/sh /bin/stty /usr/bin/script \
                        /usr/bin/env /usr/bin/python3 /usr/bin/yes /usr/bin/tail; do
            test -x "$binary" || { echo "::error::missing $binary"; exit 1; }
          done

      - name: Integration tests
        env:
          # A missing binary must fail rather than skip: a green run that
          # skipped everything is the defect these suites just stopped having.
          TASKCHUTE_TEST_REQUIRE_BINARIES: "1"
        run: npm run test:integration
